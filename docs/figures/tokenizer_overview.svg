<svg xmlns="http://www.w3.org/2000/svg" width="1165" height="450" viewBox="0 30 1165 450"
     font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <!--
    Method overview (Fig. 1). Minimal labels by design.
    Replace the two dashed placeholders with your PyMOL renders:
      <image href="complex.png" x="30"  y="230" width="140" height="140" preserveAspectRatio="xMidYMid slice"/>
      <image href="recon.png"   x="995" y="230" width="140" height="140" preserveAspectRatio="xMidYMid slice"/>
    Colour the protein teal and the ligand amber in PyMOL to match the token strip.

    NOTE: every head is a Linear(256 -> ยท) over the WHOLE decoder trunk vector h
    (src/tokenizers/vqvae.py), so h is deliberately drawn undivided.
  -->
  <defs>
    <style>
      .lab{font-size:15px;fill:#16202b}
      .mth{font-size:15px;font-style:italic;fill:#16202b}
      .blk{font-size:11px}
      .an{font-size:10px}
      .cap{font-size:10.5px;fill:#5c6773}
      .tny{font-size:11px;fill:#8b95a1}
      .xn{font-size:10.5px;fill:#8f9aa6}
      .ar{fill:none;stroke:#96a1ad;stroke-width:2.2;stroke-linecap:round;marker-end:url(#ah)}
      .br{fill:none;stroke:#aeb8c3;stroke-width:1.8;stroke-linecap:round;marker-end:url(#ahs)}
      .mg{fill:none;stroke:#aeb8c3;stroke-width:1.8}
      .grid{stroke:#ffffff;stroke-width:1.5;stroke-linecap:round}
      .ph{fill:#f5f7f9;stroke:#c6cfd8;stroke-width:1.6;stroke-dasharray:7 5}
    </style>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0,0.8 L9.5,5 L0,9.2 Z" fill="#96a1ad"/>
    </marker>
    <marker id="ahs" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9.5,5 L0,9 Z" fill="#aeb8c3"/>
    </marker>
  </defs>

  <rect width="1165" height="480" fill="#ffffff"/>

  <!-- ============ complex ============ -->
  <rect class="ph" x="30" y="230" width="140" height="140" rx="12"/>
  <text class="tny" x="100" y="294" text-anchor="middle">PyMOL render</text>
  <text class="tny" x="100" y="311" text-anchor="middle">of the complex</text>
  <text class="lab" x="100" y="398" text-anchor="middle">complex</text>

  <path class="ar" d="M176,300 H188"/>

  <!-- ============ encoder (funnel) ============ -->
  <text class="lab" x="246" y="199" text-anchor="middle" fill="#29457f">encoder</text>
  <path d="M194,210 L299,242 V358 L194,390 Z" fill="#dde8fa" stroke="#a6c1ee"
        stroke-width="12" stroke-linejoin="round"/>
  <path d="M194,210 L299,242 V358 L194,390 Z" fill="#dde8fa"/>
  <rect x="204" y="246" width="85" height="32" rx="6" fill="#ffffff" stroke="#a6c1ee" stroke-width="1.2"/>
  <text class="blk" x="246" y="260" text-anchor="middle" fill="#29457f">Multi-Head</text>
  <text class="blk" x="246" y="273" text-anchor="middle" fill="#29457f">Attention</text>
  <rect x="204" y="282" width="85" height="16" rx="5" fill="#eef3fd" stroke="#c3d5f4" stroke-width="1.1"/>
  <text class="an" x="246" y="293" text-anchor="middle" fill="#5a7cbb">Add &amp; Norm</text>
  <rect x="204" y="302" width="85" height="24" rx="6" fill="#ffffff" stroke="#a6c1ee" stroke-width="1.2"/>
  <text class="blk" x="246" y="318" text-anchor="middle" fill="#29457f">Feed Forward</text>
  <rect x="204" y="330" width="85" height="16" rx="5" fill="#eef3fd" stroke="#c3d5f4" stroke-width="1.1"/>
  <text class="an" x="246" y="341" text-anchor="middle" fill="#5a7cbb">Add &amp; Norm</text>
  <text class="xn" x="232" y="366" text-anchor="middle">× N</text>

  <path class="ar" d="M303,300 H315"/>

  <!-- ============ z_e : one embedding per atom ============ -->
  <rect x="335" y="241" width="36" height="90" rx="7" fill="#eef3fd" stroke="#c3d5f4" stroke-width="1.4"/>
  <rect x="328" y="248" width="36" height="90" rx="7" fill="#e6eefb" stroke="#b4c9f1" stroke-width="1.4"/>
  <rect x="321" y="255" width="36" height="90" rx="7" fill="#dde8fa" stroke="#a6c1ee" stroke-width="1.5"/>
  <path class="grid" d="M321,273 H357 M321,291 H357 M321,309 H357 M321,327 H357"/>
  <text class="mth" x="339" y="368" text-anchor="middle">z<tspan font-size="10" dy="4">e</tspan></text>

  <!-- z_e -> codebook -->
  <path class="ar" d="M375,300 H379 Q386,300 386,293 V152 Q386,145 393,145 H391"/>
  <text class="cap" x="380" y="243" text-anchor="end">nearest code</text>

  <!-- ============ codebook ============ -->
  <rect x="397" y="80" width="150" height="130" rx="13" fill="#fcebd8" stroke="#f0c48d" stroke-width="1.6"/>
  <text class="lab" x="472" y="105" text-anchor="middle" fill="#8a5218">codebook</text>
  <g fill="#f0b276">
    <rect x="411" y="122" width="15" height="62" rx="5"/>
    <rect x="436" y="122" width="15" height="62" rx="5"/>
    <rect x="486" y="122" width="15" height="62" rx="5"/>
    <rect x="517" y="122" width="15" height="62" rx="5"/>
  </g>
  <rect x="461" y="116" width="15" height="74" rx="5" fill="#e0761f"/>
  <text x="506" y="157" text-anchor="middle" font-size="13" fill="#c98842">···</text>
  <g class="an" fill="#a5713a" text-anchor="middle">
    <text x="418" y="204">e<tspan font-size="8" dy="1.5">1</tspan></text>
    <text x="443" y="204">e<tspan font-size="8" dy="1.5">2</tspan></text>
    <text x="468" y="204" fill="#c2591a" font-weight="600">e<tspan font-size="8" dy="1.5">k</tspan></text>
    <text x="493" y="204">e<tspan font-size="8" dy="1.5">4</tspan></text>
    <text x="524" y="204">e<tspan font-size="8" dy="1.5">K</tspan></text>
  </g>

  <!-- codebook -> tokens -->
  <path class="ar" d="M468,212 V382"/>
  <g stroke-width="1.4">
    <rect x="397" y="388" width="30" height="32" rx="6" fill="#deeef5" stroke="#a3cadf"/>
    <rect x="427" y="388" width="30" height="32" rx="6" fill="#deeef5" stroke="#a3cadf"/>
    <rect x="457" y="388" width="30" height="32" rx="6" fill="#deeef5" stroke="#a3cadf"/>
    <rect x="487" y="388" width="30" height="32" rx="6" fill="#fbe6d1" stroke="#eec095"/>
    <rect x="517" y="388" width="30" height="32" rx="6" fill="#fbe6d1" stroke="#eec095"/>
  </g>
  <g font-size="11.5" text-anchor="middle" font-family="Menlo, Consolas, monospace">
    <text x="412" y="409" fill="#1f5b7a">318</text>
    <text x="442" y="409" fill="#1f5b7a">771</text>
    <text x="472" y="409" fill="#1f5b7a">5904</text>
    <text x="502" y="409" fill="#a85a17">4402</text>
    <text x="532" y="409" fill="#a85a17">77</text>
  </g>
  <text class="lab" x="472" y="445" text-anchor="middle">tokens</text>

  <!-- codebook -> z_q -->
  <path class="ar" d="M551,145 H555 Q562,145 562,152 V293 Q562,300 569,300 H565"/>

  <!-- ============ z_q ============ -->
  <rect x="581" y="241" width="36" height="90" rx="7" fill="#eef8f1" stroke="#c6e4d1" stroke-width="1.4"/>
  <rect x="574" y="248" width="36" height="90" rx="7" fill="#e6f4ea" stroke="#b5dcc3" stroke-width="1.4"/>
  <rect x="567" y="255" width="36" height="90" rx="7" fill="#ddf0e4" stroke="#a2d3b4" stroke-width="1.5"/>
  <path class="grid" d="M567,273 H603 M567,291 H603 M567,309 H603 M567,327 H603"/>
  <text class="mth" x="585" y="368" text-anchor="middle">z<tspan font-size="10" dy="4">q</tspan></text>

  <path class="ar" d="M621,300 H633"/>

  <!-- ============ decoder (funnel) ============ -->
  <text class="lab" x="691" y="199" text-anchor="middle" fill="#1f6b45">decoder</text>
  <path d="M639,242 L744,210 V390 L639,358 Z" fill="#ddf0e4" stroke="#a2d3b4"
        stroke-width="12" stroke-linejoin="round"/>
  <path d="M639,242 L744,210 V390 L639,358 Z" fill="#ddf0e4"/>
  <rect x="649" y="246" width="85" height="32" rx="6" fill="#ffffff" stroke="#a2d3b4" stroke-width="1.2"/>
  <text class="blk" x="691" y="260" text-anchor="middle" fill="#1f6b45">Multi-Head</text>
  <text class="blk" x="691" y="273" text-anchor="middle" fill="#1f6b45">Attention</text>
  <rect x="649" y="282" width="85" height="16" rx="5" fill="#eef8f1" stroke="#c6e4d1" stroke-width="1.1"/>
  <text class="an" x="691" y="293" text-anchor="middle" fill="#4d8f6d">Add &amp; Norm</text>
  <rect x="649" y="302" width="85" height="24" rx="6" fill="#ffffff" stroke="#a2d3b4" stroke-width="1.2"/>
  <text class="blk" x="691" y="318" text-anchor="middle" fill="#1f6b45">Feed Forward</text>
  <rect x="649" y="330" width="85" height="16" rx="5" fill="#eef8f1" stroke="#c6e4d1" stroke-width="1.1"/>
  <text class="an" x="691" y="341" text-anchor="middle" fill="#4d8f6d">Add &amp; Norm</text>
  <text class="xn" x="704" y="366" text-anchor="middle">× N</text>

  <path class="ar" d="M748,300 H760"/>

  <!-- ============ h : one vector per atom ============ -->
  <rect x="780" y="241" width="36" height="90" rx="7" fill="#eef8f1" stroke="#c6e4d1" stroke-width="1.4"/>
  <rect x="773" y="248" width="36" height="90" rx="7" fill="#e6f4ea" stroke="#b5dcc3" stroke-width="1.4"/>
  <rect x="766" y="255" width="36" height="90" rx="7" fill="#ddf0e4" stroke="#a2d3b4" stroke-width="1.5"/>
  <path class="grid" d="M766,273 H802 M766,291 H802 M766,309 H802 M766,327 H802"/>
  <text class="mth" x="784" y="368" text-anchor="middle">h</text>

  <!-- ============ prediction heads ============ -->
  <g class="br">
    <path d="M820,282 C 832,282 826,195 834,195"/>
    <path d="M820,292 C 832,292 826,265 834,265"/>
    <path d="M820,308 C 832,308 826,335 834,335"/>
    <path d="M820,318 C 832,318 826,405 834,405"/>
  </g>

  <path d="M840,172 L935,181 V209 L840,218 Z" fill="#e6e1f7" stroke="#b7abe4"
        stroke-width="10" stroke-linejoin="round"/>
  <path d="M840,172 L935,181 V209 L840,218 Z" fill="#e6e1f7"/>
  <text class="blk" x="884" y="199" text-anchor="middle" fill="#4a3d8f">coordinates</text>

  <path d="M840,242 L935,251 V279 L840,288 Z" fill="#d9edf3" stroke="#97c6d6"
        stroke-width="10" stroke-linejoin="round"/>
  <path d="M840,242 L935,251 V279 L840,288 Z" fill="#d9edf3"/>
  <text class="blk" x="884" y="269" text-anchor="middle" fill="#1c5f74">element</text>

  <path d="M840,312 L935,321 V349 L840,358 Z" fill="#d9edf3" stroke="#97c6d6"
        stroke-width="10" stroke-linejoin="round"/>
  <path d="M840,312 L935,321 V349 L840,358 Z" fill="#d9edf3"/>
  <text class="blk" x="884" y="339" text-anchor="middle" fill="#1c5f74">charge</text>

  <path d="M840,382 L935,391 V419 L840,428 Z" fill="#d9edf3" stroke="#97c6d6"
        stroke-width="10" stroke-linejoin="round"/>
  <path d="M840,382 L935,391 V419 L840,428 Z" fill="#d9edf3"/>
  <text class="blk" x="884" y="409" text-anchor="middle" fill="#1c5f74">residue</text>

  <text class="xn" x="887" y="452" text-anchor="middle">···</text>

  <g class="mg">
    <path d="M940,195 C 958,195 954,296 969,298"/>
    <path d="M940,265 C 958,265 956,299 969,299"/>
    <path d="M940,335 C 958,335 956,301 969,301"/>
    <path d="M940,405 C 958,405 954,304 969,302"/>
  </g>
  <path class="ar" d="M971,300 H989"/>

  <!-- ============ reconstruction ============ -->
  <rect class="ph" x="995" y="230" width="140" height="140" rx="12"/>
  <text class="tny" x="1065" y="294" text-anchor="middle">PyMOL render</text>
  <text class="tny" x="1065" y="311" text-anchor="middle">of decoded atoms</text>
  <text class="lab" x="1065" y="398" text-anchor="middle">reconstruction</text>
</svg>
