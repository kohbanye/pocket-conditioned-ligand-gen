<svg xmlns="http://www.w3.org/2000/svg" width="906" height="212" viewBox="0 82 906 212"
     font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <!--
    Pocket-conditioned generation with ProLIT-CLM + flow-matching pose refiner.
    Teal = pocket tokens, amber = generated ligand tokens (dashed = next position).
    Replace the dashed placeholder with a PyMOL render:
      <image href="generated.png" x="756" y="130" width="120" height="120" preserveAspectRatio="xMidYMid slice"/>
  -->
  <defs>
    <style>
      .lab{font-size:13px;fill:#16202b}
      .ttl{font-size:13px;font-weight:600}
      .blk{font-size:11px}
      .cap{font-size:10px;fill:#6b7683}
      .tny{font-size:10px;fill:#8b95a1}
      .ar{fill:none;stroke:#96a1ad;stroke-width:2.2;stroke-linecap:round;marker-end:url(#ah)}
      .loop{fill:none;stroke:#b7abe4;stroke-width:1.8;stroke-linecap:round;marker-end:url(#ahv)}
      .ph{fill:#f5f7f9;stroke:#c6cfd8;stroke-width:1.5;stroke-dasharray:6 4}
    </style>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0,0.8 L9.5,5 L0,9.2 Z" fill="#96a1ad"/>
    </marker>
    <marker id="ahv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9.5,5 L0,9 Z" fill="#b7abe4"/>
    </marker>
  </defs>

  <rect x="0" y="82" width="906" height="212" fill="#ffffff"/>

  <!-- ============ pocket prompt ============ -->
  <g fill="#deeef5" stroke="#a3cadf" stroke-width="1.3">
    <rect x="30" y="172" width="20" height="36" rx="5"/>
    <rect x="53" y="172" width="20" height="36" rx="5"/>
    <rect x="76" y="172" width="20" height="36" rx="5"/>
    <rect x="99" y="172" width="20" height="36" rx="5"/>
    <rect x="122" y="172" width="20" height="36" rx="5"/>
  </g>
  <text class="lab" x="86" y="234" text-anchor="middle">pocket tokens</text>

  <path class="ar" d="M146,190 H166"/>

  <!-- ============ ProLIT-CLM ============ -->
  <rect x="170" y="120" width="120" height="140" rx="13" fill="#ddf0e4" stroke="#a2d3b4" stroke-width="1.6"/>
  <text class="ttl" x="230" y="149" text-anchor="middle" fill="#1f6b45">ProLIT-CLM</text>
  <g fill="#f1f9f4" stroke="#a2d3b4" stroke-width="1.2">
    <rect x="184" y="164" width="92" height="15" rx="5"/>
    <rect x="184" y="185" width="92" height="15" rx="5"/>
    <rect x="184" y="206" width="92" height="15" rx="5"/>
  </g>
  <text class="cap" x="230" y="240" text-anchor="middle" fill="#4d8f6d">× N</text>
  <text class="cap" x="230" y="280" text-anchor="middle">Qwen3-based · causal</text>

  <path class="ar" d="M294,190 H342"/>
  <text class="cap" x="318" y="180" text-anchor="middle">next token</text>

  <!-- ============ generated ligand tokens ============ -->
  <g fill="#fbe6d1" stroke="#eec095" stroke-width="1.3">
    <rect x="350" y="172" width="20" height="36" rx="5"/>
    <rect x="373" y="172" width="20" height="36" rx="5"/>
    <rect x="396" y="172" width="20" height="36" rx="5"/>
    <rect x="419" y="172" width="20" height="36" rx="5"/>
  </g>
  <rect x="442" y="172" width="20" height="36" rx="5" fill="#fdf6ee" stroke="#eec095"
        stroke-width="1.3" stroke-dasharray="4 3"/>
  <text class="lab" x="406" y="234" text-anchor="middle">generated ligand tokens</text>
  <text class="cap" x="406" y="252" text-anchor="middle">nucleus sampling</text>

  <!-- autoregressive feedback -->
  <path class="loop" d="M429,168 V112 Q429,104 421,104 H238 Q230,104 230,112 V116"/>
  <text class="cap" x="330" y="98" text-anchor="middle" fill="#6f62b8">fed back as input</text>

  <path class="ar" d="M466,190 H486"/>

  <!-- ============ VQ-VAE decoder ============ -->
  <text class="lab" x="535" y="126" text-anchor="middle" fill="#1f6b45">VQ-VAE decoder</text>
  <path d="M490,162 L580,142 V238 L490,218 Z" fill="#ddf0e4" stroke="#a2d3b4"
        stroke-width="10" stroke-linejoin="round"/>
  <path d="M490,162 L580,142 V238 L490,218 Z" fill="#ddf0e4"/>
  <text class="cap" x="535" y="270" text-anchor="middle">elements + coordinates</text>

  <path class="ar" d="M586,190 H604"/>

  <!-- ============ pose refiner ============ -->
  <rect x="608" y="140" width="130" height="100" rx="13" fill="#e6e1f7" stroke="#b7abe4" stroke-width="1.6"/>
  <text class="ttl" x="673" y="166" text-anchor="middle" fill="#4a3d8f">pose refiner</text>
  <g stroke="#a9a2c9" stroke-width="1.4" fill="none">
    <path d="M624,206 L636,192 L649,204 L643,218"/>
  </g>
  <g fill="#a9a2c9">
    <circle cx="624" cy="206" r="3"/><circle cx="636" cy="192" r="3"/>
    <circle cx="649" cy="204" r="3"/><circle cx="643" cy="218" r="3"/>
  </g>
  <path d="M657,205 H667" stroke="#8f86bd" stroke-width="1.6" marker-end="url(#ahv)" fill="none"/>
  <g stroke="#6f62b8" stroke-width="1.6" fill="none">
    <path d="M685,212 L697,196 L711,204 L705,220"/>
  </g>
  <g fill="#6f62b8">
    <circle cx="685" cy="212" r="3.2"/><circle cx="697" cy="196" r="3.2"/>
    <circle cx="711" cy="204" r="3.2"/><circle cx="705" cy="220" r="3.2"/>
  </g>
  <text class="cap" x="673" y="264" text-anchor="middle">E(3)-equivariant flow matching</text>

  <path class="ar" d="M742,190 H754"/>

  <!-- ============ generated ligand ============ -->
  <rect class="ph" x="756" y="130" width="120" height="120" rx="11"/>
  <text class="tny" x="816" y="184" text-anchor="middle">PyMOL render</text>
  <text class="tny" x="816" y="201" text-anchor="middle">of the generated pose</text>
  <text class="lab" x="816" y="276" text-anchor="middle">generated ligand</text>
</svg>
