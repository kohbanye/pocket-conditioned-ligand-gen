<svg xmlns="http://www.w3.org/2000/svg" width="882" height="235" viewBox="0 100 882 235"
     font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <!-- Pose rescoring with ProLIT-MLM. Teal = pocket tokens, amber = ligand tokens. -->
  <defs>
    <style>
      .lab{font-size:13px;fill:#16202b}
      .ttl{font-size:13px;font-weight:600}
      .blk{font-size:11px}
      .an{font-size:10px}
      .cap{font-size:10px;fill:#6b7683}
      .ar{fill:none;stroke:#96a1ad;stroke-width:2.2;stroke-linecap:round;marker-end:url(#ah)}
      .br{fill:none;stroke:#aeb8c3;stroke-width:1.6;stroke-linecap:round;marker-end:url(#ahs)}
      .thin{fill:none;stroke:#aeb8c3;stroke-width:1.5;stroke-linecap:round}
      .grid{stroke:#ffffff;stroke-width:1.4;stroke-linecap:round}
    </style>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0,0.8 L9.5,5 L0,9.2 Z" fill="#96a1ad"/>
    </marker>
    <marker id="ahs" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9.5,5 L0,9 Z" fill="#aeb8c3"/>
    </marker>
  </defs>

  <rect x="0" y="100" width="882" height="235" fill="#ffffff"/>

  <!-- ============ token sequence ============ -->
  <g fill="#deeef5" stroke="#a3cadf" stroke-width="1.3">
    <rect x="30" y="182" width="20" height="36" rx="5"/>
    <rect x="53" y="182" width="20" height="36" rx="5"/>
    <rect x="76" y="182" width="20" height="36" rx="5"/>
    <rect x="99" y="182" width="20" height="36" rx="5"/>
    <rect x="122" y="182" width="20" height="36" rx="5"/>
  </g>
  <g fill="#fbe6d1" stroke="#eec095" stroke-width="1.3">
    <rect x="145" y="182" width="20" height="36" rx="5"/>
    <rect x="168" y="182" width="20" height="36" rx="5"/>
    <rect x="191" y="182" width="20" height="36" rx="5"/>
    <rect x="214" y="182" width="20" height="36" rx="5"/>
    <rect x="237" y="182" width="20" height="36" rx="5"/>
  </g>
  <text class="lab" x="86" y="244" text-anchor="middle">pocket tokens</text>
  <text class="lab" x="201" y="244" text-anchor="middle">ligand tokens</text>

  <path class="ar" d="M261,200 H281"/>

  <!-- ============ ProLIT-MLM ============ -->
  <rect x="285" y="115" width="120" height="170" rx="13" fill="#dde8fa" stroke="#a6c1ee" stroke-width="1.6"/>
  <text class="ttl" x="345" y="141" text-anchor="middle" fill="#29457f">ProLIT-MLM</text>
  <rect x="299" y="156" width="92" height="32" rx="6" fill="#ffffff" stroke="#a6c1ee" stroke-width="1.2"/>
  <text class="blk" x="345" y="171" text-anchor="middle" fill="#29457f">Multi-Head</text>
  <text class="blk" x="345" y="184" text-anchor="middle" fill="#29457f">Attention</text>
  <rect x="299" y="192" width="92" height="16" rx="5" fill="#eef3fd" stroke="#c3d5f4" stroke-width="1.1"/>
  <text class="an" x="345" y="203" text-anchor="middle" fill="#5a7cbb">Add &amp; Norm</text>
  <rect x="299" y="212" width="92" height="24" rx="6" fill="#ffffff" stroke="#a6c1ee" stroke-width="1.2"/>
  <text class="blk" x="345" y="228" text-anchor="middle" fill="#29457f">Feed Forward</text>
  <rect x="299" y="240" width="92" height="16" rx="5" fill="#eef3fd" stroke="#c3d5f4" stroke-width="1.1"/>
  <text class="an" x="345" y="251" text-anchor="middle" fill="#5a7cbb">Add &amp; Norm</text>
  <text class="cap" x="345" y="274" text-anchor="middle" fill="#5a7cbb">× N</text>
  <text class="cap" x="345" y="305" text-anchor="middle">ESM3-based · bidirectional</text>

  <path class="ar" d="M409,200 H429"/>

  <!-- ============ token representations ============ -->
  <g stroke-width="1.3">
    <rect x="433" y="167" width="14" height="66" rx="4" fill="#deeef5" stroke="#a3cadf"/>
    <rect x="450" y="167" width="14" height="66" rx="4" fill="#deeef5" stroke="#a3cadf"/>
    <rect x="467" y="167" width="14" height="66" rx="4" fill="#deeef5" stroke="#a3cadf"/>
    <rect x="484" y="167" width="14" height="66" rx="4" fill="#deeef5" stroke="#a3cadf"/>
    <rect x="501" y="167" width="14" height="66" rx="4" fill="#fbe6d1" stroke="#eec095"/>
    <rect x="518" y="167" width="14" height="66" rx="4" fill="#fbe6d1" stroke="#eec095"/>
    <rect x="535" y="167" width="14" height="66" rx="4" fill="#fbe6d1" stroke="#eec095"/>
    <rect x="552" y="167" width="14" height="66" rx="4" fill="#fbe6d1" stroke="#eec095"/>
  </g>
  <path class="grid" d="M433,180 H447 M450,180 H464 M467,180 H481 M484,180 H498 M501,180 H515 M518,180 H532 M535,180 H549 M552,180 H566
                        M433,193 H447 M450,193 H464 M467,193 H481 M484,193 H498 M501,193 H515 M518,193 H532 M535,193 H549 M552,193 H566
                        M433,207 H447 M450,207 H464 M467,207 H481 M484,207 H498 M501,207 H515 M518,207 H532 M535,207 H549 M552,207 H566
                        M433,220 H447 M450,220 H464 M467,220 H481 M484,220 H498 M501,220 H515 M518,220 H532 M535,220 H549 M552,220 H566"/>
  <text class="lab" x="499" y="290" text-anchor="middle">token representations</text>

  <!-- ligand-token selection -->
  <path class="thin" d="M501,240 V245 H566 V240"/>
  <path class="br" d="M533,245 C 533,262 555,265 578,265"/>

  <!-- ============ pooling + heads ============ -->
  <rect x="582" y="250" width="80" height="30" rx="10" fill="#f2eefc" stroke="#c8bcee" stroke-width="1.3"/>
  <text class="blk" x="622" y="269" text-anchor="middle" fill="#4a3d8f">mean-pool</text>

  <path class="ar" d="M666,265 H680"/>

  <path d="M695,231 L785,247 V275 L695,289 Z" fill="#f0ecfb" stroke="#cdc4f0"
        stroke-width="8" stroke-linejoin="round"/>
  <path d="M695,231 L785,247 V275 L695,289 Z" fill="#f0ecfb"/>
  <path d="M690,236 L780,252 V280 L690,294 Z" fill="#eae5f9" stroke="#c2b7ec"
        stroke-width="8" stroke-linejoin="round"/>
  <path d="M690,236 L780,252 V280 L690,294 Z" fill="#eae5f9"/>
  <path d="M685,241 L775,257 V285 L685,299 Z" fill="#e6e1f7" stroke="#b7abe4"
        stroke-width="8" stroke-linejoin="round"/>
  <path d="M685,241 L775,257 V285 L685,299 Z" fill="#e6e1f7"/>
  <text class="blk" x="728" y="274" text-anchor="middle" fill="#4a3d8f">MLP head</text>
  <text class="cap" x="728" y="318" text-anchor="middle">ensemble</text>

  <path class="ar" d="M780,271 H794"/>
  <rect x="800" y="256" width="62" height="30" rx="8" fill="#ffffff" stroke="#b7abe4" stroke-width="1.5"/>
  <text class="blk" x="831" y="275" text-anchor="middle" fill="#4a3d8f">− RMSD</text>
  <text class="cap" x="831" y="304" text-anchor="middle">pose score</text>
</svg>
