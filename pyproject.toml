[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pocket-conditioned-ligand-gen"
version = "0.1.0"
description = "ProLIT: a chemistry-aware all-atom tokenizer for 3D protein-ligand interfaces, and the language models trained on its tokens."
readme = "README.md"
# Capped at <3.13 because the benchmark members cap there (biotite / posebusters
# wheels), and a uv workspace resolves one environment for every member.
requires-python = ">=3.12,<3.13"
dependencies = [
    "biopython>=1.84",
    "marimo>=0.23.2",
    "lightning>=2.5.6",
    "matplotlib>=3.10.7",
    "numpy>=2.3.5",
    "pandas>=2.3.3",
    "py3dmol>=2.5.4",
    "pytest>=9.0.1",
    "rdkit",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "torch>=2.9.1",
    "torchmetrics>=1.8.2",
    "tqdm>=4.67.1",
    "wandb>=0.23.0",
    "huggingface-hub>=0.25.0",
    "pyarrow>=18.0.0",
    "transformers>=4.51",
    "e3nn>=0.6.0",
    "posebusters>=0.3.1",
]

[tool.setuptools.packages.find]
# Scoped to src/. An unscoped `where = ["."]` makes setuptools walk data/,
# outputs/, wandb/ and the run directories -- millions of files -- so metadata
# generation stalls and anything installing this project appears to hang.
where = ["src"]

[tool.uv.workspace]
# Benchmarks that share this environment: they keep their own dependency lists
# but resolve into one lockfile together with the model library they evaluate.
#
# benchmarks/recon-bench is deliberately NOT a member. It runs ESM3 in-process, and
# ESM3 depends on a fork of transformers (Biohub/transformers @ ef32577) that
# would replace the transformers 5.x the ProLIT language models are built on --
# a workspace resolves one version per package, so membership would silently
# downgrade the model library. recon_bench stays a standalone uv project with its
# own venv, which is already the pattern its FoldToken and Bio2Token adapters
# use (.venv-foldtoken / .venv-bio2token, driven as subprocesses).
members = ["benchmarks/common", "benchmarks/sbdd-bench", "benchmarks/pose-rescoring-bench"]
exclude = ["benchmarks/recon-bench"]

[tool.pytest.ini_options]
# One command covers the library, the pipelines and every in-workspace
# benchmark. benchmarks/recon-bench is excluded: it has its own environment (ESM3
# pins a conflicting transformers), so run it with its own interpreter.
testpaths = ["tests", "benchmarks"]
norecursedirs = ["third_party", "benchmarks/recon-bench", ".venv", "data", "outputs"]

[tool.ruff]
extend-exclude = ["third_party", "benchmarks/*/third_party"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "N812", "COM812"]

[tool.ruff.lint.per-file-ignores]
# Entry points, not packages: they are invoked by path, print their progress,
# and legitimately have no __init__.py.
"scripts/*.py" = ["INP001", "T201"]
"pipelines/**/*.py" = ["INP001", "T201"]
"jobs/*.py" = ["INP001", "T201"]
"benchmarks/*/scripts/*.py" = ["INP001", "T201"]
# Tests assert, compare against literal expected values, and are not packages.
"tests/*.py" = ["S101", "PLR2004", "INP001"]
"benchmarks/**/test_*.py" = ["S101", "PLR2004", "INP001"]
"benchmarks/*/tests/*.py" = ["S101", "PLR2004", "INP001"]
"notebooks/*.ipynb" = ["T201", "E402", "ANN", "E501", "PLR2004", "INP001", "S101"]
"notebooks/*.py" = [
    "ANN001",     # marimo cell args are reactive-deps with complex types
    "ANN2",       # marimo cell return types are complex tuples of exported variables
    "E402",       # import inside cell function — same as PLC0415, marimo structure
    "E501",       # line too long — Japanese markdown, long checkpoint paths
    "T201",       # print() — notebooks use print for output
    "PLC0415",    # import inside function — marimo cell structure
    "PLR0913",    # too many arguments — marimo cell dependencies
    "PLR0915",    # too many statements — large cells
    "PLR1711",    # useless return — marimo empty cells end with bare return
    "SLF001",     # private member access — py3Dmol has no public HTML export API
    "N803",       # uppercase argument name — class names as cell deps
    "N806",       # uppercase variable — constants in cell scope
    "B018",       # useless expression — marimo cell output pattern (_fig)
    "INP001",     # no __init__.py in notebooks/
    "RUF001",     # ambiguous unicode — Japanese text in markdown
    "UP037",      # quoted annotations needed — marimo exec() ignores __future__ annotations
    "PLR2004",    # magic values — thresholds and column counts read better inline
    "C901",       # complex-structure — a cell is one narrative block, not a function
    "PD011",      # .values — the notebooks predate the .to_numpy() preference
    "PD013",      # .stack() — same
    "PD010",      # .pivot_table() — same
    "B007",       # unused loop variable — cells iterate for side effects
    "B905",       # zip() without strict= — lengths are asserted upstream
    "FBT003",     # boolean positional — matplotlib/seaborn take them that way
    "ICN001",     # import alias — notebooks import plotting libs conventionally
    "RUF005",     # list concat — clearer than unpacking in a plotting call
    "RUF046",     # int() cast — explicit is fine here
    "RUF059",     # unused unpacked variable — tuple returns from cells
    "N802",       # function name — notebook helpers mirror column names
    "ANN202",     # return type on a nested helper inside a cell
    "F841",       # assigned-but-unused — marimo cells export by assignment
    "B023",       # loop-variable closure — cells build closures per subplot
]

[dependency-groups]
dev = [
    "ruff>=0.14.6",
    "ty>=0.0.1a28",
    "nbformat>=5.10.4",
    "nbconvert>=7.16.4",
    "playwright>=1.58.0",
]
