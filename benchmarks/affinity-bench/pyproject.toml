[project]
name = "prolit-affinity-bench"
version = "0.1.0"
description = "CASF-2016 scoring and ranking power for the ProLIT affinity head."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.10.7",
    "numpy>=2.3.5",
    "pandas>=2.3.3",
    "pytest>=9.0.1",
    "rdkit",
    "scipy>=1.14",
    "torch>=2.9.1",
    "tqdm>=4.67.1",
    # The model library under test. A workspace member, so `import prolit.*`
    # resolves without a sys.path shim.
    "pocket-conditioned-ligand-gen",
    "prolit-bench-common",
]

[tool.uv.sources]
pocket-conditioned-ligand-gen = { workspace = true }
prolit-bench-common = { workspace = true }

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["affinity_bench*"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "N812", "COM812"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["INP001", "T201", "E501"]
"tests/*.py" = ["S101", "PLR2004", "INP001"]
# The inference driver reports progress through long qsub runs.
"affinity_bench/inference.py" = ["T201"]

[dependency-groups]
dev = [
    "ruff>=0.14.6",
    "ty>=0.0.1a28",
]
